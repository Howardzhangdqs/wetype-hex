name: Release wetype-hex

# Builds the fork's `hex` binary for Linux, macOS, and Windows and attaches the
# archives to a GitHub release. Dispatch-only: the upstream Release workflow
# belongs to Anomaly's signing service and is disabled on this fork.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. wetype-v3.4.0-1"
        required: true
        type: string
      version:
        description: "Version in the asset names, e.g. 3.4.0-1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: wetype-release-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            os: ubuntu-24.04
            target: linux-x86_64
            archive: tar.gz
          - label: macOS arm64
            os: macos-15
            target: macos-arm64
            archive: tar.gz
          - label: Windows x86_64
            os: windows-latest
            target: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: wetype-${{ matrix.target }}
          cache-on-failure: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake pkg-config python3 \
            libasound2-dev libssl-dev libgtk-3-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libfontconfig1-dev libfreetype-dev \
            libxcursor-dev libxi-dev libxrandr-dev libopenblas-dev \
            libegl1-mesa-dev

      - name: Install the Metal toolchain
        if: runner.os == 'macOS'
        run: xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: Build
        env:
          TRANSCRIBE_CMAKE_ARGS: -DTRANSCRIBE_VULKAN=OFF -DGGML_NATIVE=OFF
        run: cargo build --locked --release --bin hex

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p "dist/wetype-hex-${{ inputs.version }}-${{ matrix.target }}"
          cp target/release/hex "dist/wetype-hex-${{ inputs.version }}-${{ matrix.target }}/wetype-hex"
          cp README.md LICENSE "dist/wetype-hex-${{ inputs.version }}-${{ matrix.target }}/"
          chmod +x "dist/wetype-hex-${{ inputs.version }}-${{ matrix.target }}/wetype-hex"
          tar -czf "wetype-hex-${{ inputs.version }}-${{ matrix.target }}.tar.gz" \
            -C dist "wetype-hex-${{ inputs.version }}-${{ matrix.target }}"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "wetype-hex-${{ inputs.version }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/hex.exe "dist/$name/wetype-hex.exe"
          Copy-Item README.md, LICENSE "dist/$name"
          Compress-Archive -Path "dist/$name" -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: wetype-hex-${{ matrix.target }}
          path: wetype-hex-${{ inputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: wetype-hex ${{ inputs.version }}
          body: |
            WeChat Input Method cloud dictation for Linux, macOS, and Windows.

            Linux is the tested target. The macOS and Windows builds compile and
            share the same Rust backend, but this fork has only been exercised on
            Linux.

            Download the archive for your platform, unpack it, and run
            `./wetype-hex`. macOS may need
            `xattr -dr com.apple.quarantine wetype-hex` before the first run.
          files: dist/*
          fail_on_unmatched_files: true
